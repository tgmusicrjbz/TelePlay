<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/komod.svg" />
    <link rel="apple-touch-icon" href="/komod.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Komod" />
    <title>Komod</title>
    <meta
      name="description"
      content="کمد شخصی فایل‌های تلگرام؛ ذخیره، جست‌وجو، پخش و مرتب‌سازی در کشوها"
    />
    <!-- Persian UI font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark-950 text-white">
    <div id="root"></div>
    <button id="komod-recovery" type="button" aria-label="بازکردن دوباره کمد" style="display:none;position:fixed;left:12px;bottom:12px;z-index:2147483647;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px;background:#171b28ee;color:#fff;font:600 13px system-ui;box-shadow:0 12px 35px #0008">↻ بازکردن دوباره کمد</button>
    <script>
      // Loading Telegram synchronously can block the whole PWA while offline.
      // Load it independently and notify React if it becomes available later.
      (() => {
        let requested = false;
        const loadTelegram = () => {
          if (requested || !navigator.onLine) return;
          requested = true;
          const script = document.createElement('script');
          script.src = 'https://telegram.org/js/telegram-web-app.js';
          script.async = true;
          script.onload = () => window.dispatchEvent(new Event('komod-telegram-ready'));
          script.onerror = () => { requested = false; };
          document.head.appendChild(script);
        };
        loadTelegram();
        window.addEventListener('online', loadTelegram);
      })();
      (() => {
        const recovery = document.getElementById('komod-recovery');
        let failed = false;
        const show = () => { failed = true; if (recovery) recovery.style.display = 'block'; };
        window.addEventListener('error', show);
        window.addEventListener('unhandledrejection', show);
        setTimeout(() => { if (!document.getElementById('root')?.childElementCount) show(); }, 7000);
        recovery?.addEventListener('click', async () => {
          recovery.textContent = 'در حال بازیابی…';
          try {
            const registration = await navigator.serviceWorker?.getRegistration();
            registration?.active?.postMessage({ type: 'SKIP_WAITING' });
          } catch {}
          location.replace('/');
          setTimeout(() => location.reload(), 250);
        });
        window.addEventListener('komod-app-ready', () => { if (!failed && recovery) recovery.style.display = 'none'; });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
