<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/komod.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="کمد" />
    <title>کمد | درایو ابری تلگرام</title>
    <meta
      name="description"
      content="کمد، درایو ابری تلگرام برای ذخیره، جست‌وجو، پخش و مرتب‌سازی همه فایل‌ها"
    />
    <meta property="og:title" content="کمد؛ درایو ابری تلگرام" />
    <meta property="og:description" content="فایل‌های تلگرامت را یکجا ذخیره، مرتب و پخش کن." />
    <meta property="og:image" content="/komod-512.png" />
    <link rel="stylesheet" href="/src/boot.css" />
    <!-- Reading fonts are attached after first paint; they never gate offline boot. -->
  </head>
  <body class="bg-dark-950 text-white">
    <div id="root"><div data-komod-boot style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#07090f;color:#f8fafc;font-family:Vazirmatn,Tahoma,system-ui,-apple-system,sans-serif"><div style="width:min(320px,100%);text-align:center"><img src="/komod-192.png" alt="" width="64" height="64" style="width:64px;height:64px;border-radius:20px;box-shadow:0 18px 50px #7c3aed55"/><strong style="display:block;margin-top:18px;font-size:18px">در حال باز کردن کمد…</strong><span style="display:block;margin:12px auto 0;width:42px;height:4px;overflow:hidden;border-radius:99px;background:#ffffff18"><i style="display:block;width:55%;height:100%;border-radius:inherit;background:#d946ef;animation:komod-boot 1s ease-in-out infinite alternate"></i></span></div></div></div>
    <style>@keyframes komod-boot{from{transform:translateX(70%)}to{transform:translateX(-70%)}}@media(prefers-reduced-motion:reduce){[data-komod-boot] i{animation:none!important}}</style>
    <button id="komod-recovery" type="button" aria-label="بازیابی کمد" style="display:none;align-items:center;gap:8px;position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483647;border:1px solid rgb(168 85 247 / .28);border-radius:16px;padding:11px 14px;background:rgb(15 23 42 / .96);color:#f8fafc;font:600 13px Vazirmatn,Tahoma,system-ui;box-shadow:0 18px 45px #0009;backdrop-filter:blur(18px)"><span style="display:grid;width:28px;height:28px;place-items:center;border-radius:10px;background:rgb(168 85 247 / .16);color:rgb(216 180 254)">↻</span><span>بازیابی کمد</span></button>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
