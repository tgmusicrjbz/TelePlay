<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>کمد آفلاین است</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #07090f; color: #fff; font-family: system-ui, sans-serif; }
      main { width: min(420px, 100%); padding: 32px; text-align: center; border: 1px solid #ffffff16; border-radius: 24px; background: #121522; box-shadow: 0 24px 80px #0008; }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { margin: 18px 0 10px; font-size: 24px; }
      p { margin: 0 0 24px; color: #a7adbd; line-height: 1.8; }
      button { width: 100%; border: 0; border-radius: 12px; padding: 13px; background: #7c3aed; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="کمد" />
      <h1>فعلاً به کمد دسترسی نداریم</h1>
      <p>اتصال اینترنت را بررسی کن و دوباره تلاش کن. برای نمایش فایل‌ها و ارتباط با تلگرام باید آنلاین باشی.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
